<!DOCTYPE html>
<html lang="en">
  <!-- Title: Headset Tester Application
       Author: Andrey Chernoivanov (andrey.chernoivanov@pm.me)
       Description: Simple tool that can be used to test your headset and
       camera to make sure it's working fine
  -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headset Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base:        #0d0f14;
      --bg-surface:     #151820;
      --bg-elevated:    #1c2030;
      --bg-hover:       #222840;
      --border:         rgba(255,255,255,0.07);
      --border-focus:   rgba(99,179,237,0.5);
      --accent:         #4f9cf9;
      --accent-dim:     rgba(79,156,249,0.15);
      --accent-glow:    rgba(79,156,249,0.35);
      --success:        #34d399;
      --success-dim:    rgba(52,211,153,0.15);
      --danger:         #f87171;
      --danger-dim:     rgba(248,113,113,0.15);
      --warning:        #fbbf24;
      --text-primary:   #f0f4ff;
      --text-secondary: #8892aa;
      --text-muted:     #525c74;
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      16px;
      --shadow-sm:      0 1px 3px rgba(0,0,0,0.4);
      --shadow-md:      0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg:      0 8px 32px rgba(0,0,0,0.6);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 58px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 30px;
      height: 30px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-glow);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-info {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Main layout ─────────────────────────────────────── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel ──────────────────────────────────────── */
    .panel-left {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      gap: 16px;
    }

    /* ── Right panel ─────────────────────────────────────── */
    .panel-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: var(--bg-base);
      overflow-y: auto;
    }

    /* ── Section header ──────────────────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* ── Card ────────────────────────────────────────────── */
    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    /* ── Device select rows ──────────────────────────────── */
    .device-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .device-row:last-of-type { margin-bottom: 0; }

    .device-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .device-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .device-label svg { flex-shrink: 0; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      transition: all 0.25s ease;
    }

    .status-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.25s ease;
    }

    .status-pill.active {
      background: var(--success-dim);
      color: var(--success);
      border-color: rgba(52,211,153,0.3);
    }

    .status-pill.active .dot {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    .status-pill.inactive {
      background: var(--danger-dim);
      color: var(--danger);
      border-color: rgba(248,113,113,0.3);
    }

    .status-pill.inactive .dot { background: var(--danger); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.6; transform: scale(0.85); }
    }

    .select-wrapper { position: relative; }

    select {
      width: 100%;
      padding: 9px 34px 9px 10px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--border-focus); }
    select:hover { border-color: rgba(255,255,255,0.15); }

    .select-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
    }

    /* ── Toggle ──────────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      margin-top: 14px;
    }

    .toggle-label {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform 0.25s, background 0.25s;
    }

    .toggle-switch input:checked + .toggle-track {
      background: var(--accent-dim);
      border-color: var(--accent-glow);
    }

    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: var(--accent);
    }

    /* ── Start button ────────────────────────────────────── */
    #startBtn {
      width: 100%;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(99,102,241,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #startBtn:hover:not(:disabled) {
      opacity: 0.9;
      box-shadow: 0 4px 20px rgba(99,102,241,0.5);
    }

    #startBtn:active:not(:disabled) { transform: scale(0.98); }

    #startBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    #startBtn.recording {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 2px 12px rgba(239,68,68,0.35);
      animation: recording-glow 1.5s ease-in-out infinite;
    }

    @keyframes recording-glow {
      0%, 100% { box-shadow: 0 2px 12px rgba(239,68,68,0.35); }
      50%       { box-shadow: 0 2px 24px rgba(239,68,68,0.65); }
    }

    /* ── Status area ─────────────────────────────────────── */
    .status-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #status {
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 18px;
    }

    #deviceName {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 16px;
    }

    #warning {
      font-size: 12px;
      font-weight: 500;
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 18px;
    }

    /* ── Right panel content ─────────────────────────────── */
    .preview-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 560px;
    }

    /* ── Timer ring ──────────────────────────────────────── */
    .timer-ring-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-ring-wrap svg {
      transform: rotate(-90deg);
    }

    .timer-ring-bg { stroke: var(--bg-elevated); }
    .timer-ring-fg {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.95s linear, stroke 0.3s;
      filter: drop-shadow(0 0 4px var(--accent-glow));
    }

    .timer-inner {
      position: absolute;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
    }

    .timer-inner small {
      display: block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Video preview ───────────────────────────────────── */
    .video-wrap {
      width: 100%;
      position: relative;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .video-overlay-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--danger);
      display: none;
      align-items: center;
      gap: 5px;
    }

    .video-overlay-badge .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse-dot 1s ease-in-out infinite;
    }

    .video-overlay-badge.visible { display: flex; }

    /* ── VU Meter ────────────────────────────────────────── */
    .meter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .meter-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .meter-track {
      flex: 1;
      height: 8px;
      background: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--success) 0%, var(--accent) 60%, var(--danger) 100%);
      transition: width 0.05s linear;
    }

    /* ── Playback section ────────────────────────────────── */
    .playback-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .playback-card {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }

    .playback-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    audio, video.playback {
      width: 100%;
      height: 32px;
      border-radius: var(--radius-sm);
      accent-color: var(--accent);
    }

    video.playback {
      height: auto;
      aspect-ratio: 16/9;
      background: #000;
    }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 99px; }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Headset Tester</div>
      <div class="header-subtitle">Microphone &amp; Camera Diagnostics</div>
    </div>
  </div>
  <div class="header-info">Records 10 s · auto-playback on finish</div>
</header>

<div class="app">

  <!-- ── Left panel ─────────────────────────────────── -->
  <div class="panel-left">

    <div>
      <div class="section-label">Devices</div>
      <div class="card">

        <div class="device-row">
          <div class="device-row-header">
            <div class="device-label">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              </svg>
              Microphone
            </div>
            <div id="micPill" class="status-pill">
              <span class="dot"></span>
              <span class="pill-text">Idle</span>
            </div>
          </div>
          <div class="select-wrapper">
            <select id="audioSelect"></select>
            <svg class="select-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </div>

        <div class="device-row">
          <div class="device-row-header">
            <div class="device-label">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M23 7l-7 5 7 5V7z"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
              Camera
            </div>
            <div id="camPill" class="status-pill">
              <span class="dot"></span>
              <span class="pill-text">Idle</span>
            </div>
          </div>
          <div class="select-wrapper">
            <select id="videoSelect"></select>
            <svg class="select-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </div>

        <div class="device-row">
          <div class="device-row-header">
            <div class="device-label">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Speaker&nbsp;/ Output
            </div>
          </div>
          <div class="select-wrapper">
            <select id="audioOutputSelect"></select>
            <svg class="select-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </div>

        <div class="toggle-row">
          <div class="toggle-label">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            Enable Camera
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="enableCamera" checked>
            <span class="toggle-track"></span>
          </label>
        </div>

      </div>
    </div>

    <div>
      <div class="section-label">Controls</div>
      <button id="startBtn">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Start Test
      </button>
    </div>

    <div class="status-area">
      <p id="status">Ready — click Start Test to begin.</p>
      <p id="deviceName"></p>
      <p id="warning"></p>
    </div>

  </div>

  <!-- ── Right panel ────────────────────────────────── -->
  <div class="panel-right">
    <div class="preview-grid">

      <!-- Timer ring -->
      <div class="timer-ring-wrap">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle class="timer-ring-bg" cx="45" cy="45" r="38" stroke-width="5" fill="none"/>
          <circle id="timerRing" class="timer-ring-fg" cx="45" cy="45" r="38" stroke-width="5" fill="none"
                  stroke-dasharray="238.76" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-inner">
          <span id="timer">10</span>
          <small>sec</small>
        </div>
      </div>

      <!-- Live video -->
      <div class="video-wrap" id="videoWrap">
        <div class="video-placeholder" id="videoPlaceholder">
          <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3" viewBox="0 0 24 24">
            <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          <span>Camera preview</span>
        </div>
        <video id="video" autoplay muted style="display:none;"></video>
        <div class="video-overlay-badge" id="liveBadge">
          <span class="live-dot"></span> Live
        </div>
      </div>

      <!-- VU meter -->
      <div class="meter-row">
        <span class="meter-label">MIC INPUT</span>
        <div class="meter-track">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>

      <!-- Playback -->
      <div class="playback-row">
        <div class="playback-card">
          <div class="playback-title">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            </svg>
            Audio Playback
          </div>
          <audio id="audioPlayback" controls></audio>
        </div>
        <div class="playback-card">
          <div class="playback-title">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            Video Playback
          </div>
          <video id="videoPlayback" class="playback" controls></video>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
const startBtn          = document.getElementById('startBtn');
const statusEl          = document.getElementById('status');
const video             = document.getElementById('video');
const audioPlayback     = document.getElementById('audioPlayback');
const videoPlayback     = document.getElementById('videoPlayback');
const deviceNameEl      = document.getElementById('deviceName');
const audioSelect       = document.getElementById('audioSelect');
const videoSelect       = document.getElementById('videoSelect');
const audioOutputSelect = document.getElementById('audioOutputSelect');
const timerEl           = document.getElementById('timer');
const timerRing         = document.getElementById('timerRing');
const warningEl         = document.getElementById('warning');
const micPill           = document.getElementById('micPill');
const camPill           = document.getElementById('camPill');
const meterFill         = document.getElementById('meterFill');
const liveBadge         = document.getElementById('liveBadge');
const videoPlaceholder  = document.getElementById('videoPlaceholder');

const RING_CIRCUMFERENCE = 238.76;
const TOTAL_SECONDS = 10;

let audioStream, videoStream;
let audioRecorder, videoRecorder;
let audioChunks = [], videoChunks = [];
let audioContext, analyser, dataArray;
let silenceDuration = 0;
let countdownInterval;
let meterValue = 0;
let animFrameId;

function setPill(pill, state) {
  const dot  = pill.querySelector('.dot');
  const text = pill.querySelector('.pill-text');
  pill.className = 'status-pill';
  if (state === 'active') {
    pill.classList.add('active');
    text.textContent = 'Active';
  } else if (state === 'inactive') {
    pill.classList.add('inactive');
    text.textContent = 'Error';
  } else {
    text.textContent = 'Idle';
  }
}

function setTimerRing(secondsLeft) {
  const fraction = secondsLeft / TOTAL_SECONDS;
  timerRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - fraction);
  timerRing.style.stroke = fraction > 0.4 ? 'var(--accent)' : fraction > 0.2 ? 'var(--warning)' : 'var(--danger)';
}

const FALLBACK_NAMES = {
  audioinput:  'Microphone',
  videoinput:  'Camera',
  audiooutput: 'Speaker',
};

async function getDevices() {
  const devices = await navigator.mediaDevices.enumerateDevices();

  const prevAudio  = audioSelect.value;
  const prevVideo  = videoSelect.value;
  const prevOutput = audioOutputSelect.value;

  audioSelect.innerHTML       = '';
  videoSelect.innerHTML       = '';
  audioOutputSelect.innerHTML = '';

  const counters = { audioinput: 0, videoinput: 0, audiooutput: 0 };

  devices.forEach(device => {
    if (!(device.kind in counters)) return;
    counters[device.kind]++;

    const option = document.createElement('option');
    option.value = device.deviceId;
    option.text  = device.label || `${FALLBACK_NAMES[device.kind]} ${counters[device.kind]}`;

    if (device.kind === 'audioinput')  audioSelect.appendChild(option);
    if (device.kind === 'videoinput')  videoSelect.appendChild(option);
    if (device.kind === 'audiooutput') audioOutputSelect.appendChild(option);
  });

  if (prevAudio)  audioSelect.value       = prevAudio;
  if (prevVideo)  videoSelect.value       = prevVideo;
  if (prevOutput) audioOutputSelect.value = prevOutput;

  applySinkId();
}

function applySinkId() {
  const sinkId = audioOutputSelect.value;
  if (!sinkId || !('setSinkId' in HTMLMediaElement.prototype)) return;
  audioPlayback.setSinkId(sinkId).catch(() => {});
  videoPlayback.setSinkId(sinkId).catch(() => {});
}

audioOutputSelect.addEventListener('change', applySinkId);

function drawMeter() {
  if (!analyser) return;
  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const volume = Math.sqrt(sum / dataArray.length);
  meterValue += (volume - meterValue) * 0.2;

  const pct = Math.min(meterValue * 250, 100);
  meterFill.style.width = pct + '%';

  if (volume < 0.02) {
    silenceDuration += 1 / 60;
    setPill(micPill, 'idle');
  } else {
    silenceDuration = 0;
    setPill(micPill, 'active');
    warningEl.textContent = '';
  }

  if (silenceDuration > 2) {
    warningEl.innerHTML = `
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      No signal detected from microphone`;
  }

  animFrameId = requestAnimationFrame(drawMeter);
}

startBtn.onclick = async () => {
  startBtn.disabled = true;
  startBtn.classList.add('recording');
  statusEl.textContent = 'Requesting permissions…';
  warningEl.textContent = '';
  silenceDuration = 0;
  setPill(micPill, 'idle');
  setPill(camPill, 'idle');
  timerEl.textContent = TOTAL_SECONDS;
  setTimerRing(TOTAL_SECONDS);

  try {
    const useCamera = document.getElementById('enableCamera').checked;

    audioStream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: audioSelect.value ? { exact: audioSelect.value } : undefined }
    });

    if (useCamera) {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: videoSelect.value ? { exact: videoSelect.value } : undefined }
      });
      video.srcObject = videoStream;
      video.style.display = 'block';
      videoPlaceholder.style.display = 'none';
      liveBadge.classList.add('visible');
      setPill(camPill, 'active');
    }

    const audioTrack  = audioStream.getAudioTracks()[0];
    const videoTrack  = videoStream ? videoStream.getVideoTracks()[0] : null;
    const outputLabel = audioOutputSelect.options[audioOutputSelect.selectedIndex]?.text || '—';
    const parts = [
      'Mic: '     + (audioTrack?.label  || audioSelect.options[audioSelect.selectedIndex]?.text   || 'Unknown'),
      'Speaker: ' + outputLabel,
    ];
    if (videoTrack) parts.push('Cam: ' + (videoTrack.label || videoSelect.options[videoSelect.selectedIndex]?.text || 'Unknown'));
    deviceNameEl.textContent = parts.join('  ·  ');

    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(audioStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    dataArray = new Uint8Array(analyser.fftSize);
    source.connect(analyser);
    drawMeter();

    audioRecorder = new MediaRecorder(audioStream);
    audioChunks = [];
    audioRecorder.ondataavailable = e => audioChunks.push(e.data);

    if (useCamera) {
      videoRecorder = new MediaRecorder(videoStream);
      videoChunks = [];
      videoRecorder.ondataavailable = e => videoChunks.push(e.data);
    }

    statusEl.textContent = 'Recording…';
    audioRecorder.start();
    if (videoRecorder) videoRecorder.start();

    let timeLeft = TOTAL_SECONDS;
    timerEl.textContent = timeLeft;

    countdownInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      setTimerRing(timeLeft);
    }, 1000);

    setTimeout(() => {
      clearInterval(countdownInterval);
      audioRecorder.stop();
      if (videoRecorder) videoRecorder.stop();
      audioStream.getTracks().forEach(t => t.stop());
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      video.style.display = 'none';
      videoPlaceholder.style.display = 'flex';
      liveBadge.classList.remove('visible');
      if (animFrameId) cancelAnimationFrame(animFrameId);
      analyser = null;
      meterFill.style.width = '0%';
      setPill(micPill, 'idle');
      setPill(camPill, 'idle');
    }, 10000);

    audioRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      audioPlayback.src = URL.createObjectURL(blob);
      applySinkId();
    };

    if (videoRecorder) {
      videoRecorder.onstop = () => {
        const blob = new Blob(videoChunks, { type: 'video/webm' });
        videoPlayback.src = URL.createObjectURL(blob);
        applySinkId();
      };
    }

    setTimeout(() => {
      statusEl.textContent = 'Test complete — review playback below.';
      startBtn.disabled = false;
      startBtn.classList.remove('recording');
    }, 11000);

  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Error: ' + err.message;
    startBtn.disabled = false;
    startBtn.classList.remove('recording');
  }
};

navigator.mediaDevices.getUserMedia({ audio: true, video: true })
  .then(stream => { stream.getTracks().forEach(t => t.stop()); return getDevices(); })
  .catch(() => getDevices());

navigator.mediaDevices.ondevicechange = getDevices;
</script>

</body>
</html>
